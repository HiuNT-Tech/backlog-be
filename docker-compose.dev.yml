services:
  postgres:
    image: postgres:16-alpine
    container_name: be_02_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: be_02
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d be_02"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: be_02_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  mongo:
    image: mongo:7
    container_name: be_02_mongo_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db

volumes:
  postgres_dev_data:
  mongo_dev_data:
  redis_dev_data:
