services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: be_02_api_dev
    command: sh -c "npx prisma generate && npm run start:dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/be_02?schema=public
      MONGODB_URI: mongodb://mongo:27017/be_02
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: be_02_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: be_02
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d be_02"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: be_02_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  mongo:
    image: mongo:7
    container_name: be_02_mongo_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db

volumes:
  postgres_dev_data:
  mongo_dev_data:
  redis_dev_data:
