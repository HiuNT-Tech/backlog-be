[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ide-auto-retry"
version = "1.0.0"
description = "Auto-click Retry/Accept/Allow/Run buttons in Antigravity, VS Code, and Cursor IDE — focus-safe, cross-platform."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "HiuNT-Tech"},
]
keywords = ["ide", "auto-retry", "antigravity", "vscode", "cursor", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

[project.scripts]
auto-retry = "ide_auto_retry.cli:main"

[project.urls]
Homepage = "https://github.com/HiuuNguynn/Tool_AG_Auto_Click"
Repository = "https://github.com/HiuuNguynn/Tool_AG_Auto_Click"
Issues = "https://github.com/HiuuNguynn/Tool_AG_Auto_Click/issues"

[tool.setuptools.packages.find]
where = ["src"]
