services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: be_02_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/be_02?schema=public
      MONGODB_URI: mongodb://mongo:27017/be_02
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: be_02_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: be_02
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d be_02"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: be_02_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    container_name: be_02_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
  redis_data:
